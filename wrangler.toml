#:schema node_modules/wrangler/config-schema.json
name = "rac-website"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
PUBLIC_SITE_URL = "https://ropeaccesscenter.com"
PUBLIC_DEFAULT_LOCALE = "id"

# ---------------------------------------------------------------------------
# D1 — content database (free tier: 5 GB storage, 5M reads/day)
# Create with:  npx wrangler d1 create rac-db
# then paste the returned database_id below.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "rac-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV — edge cache for rendered content + rate limiting + sessions
# Create with:  npx wrangler kv namespace create RAC_CACHE
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Astro's built-in session store looks for a binding named SESSION. The site
# uses its own signed-cookie sessions and never writes here, but declaring it
# (pointing at the same namespace) keeps the adapter quiet at build time.
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# R2 — media library (free tier: 10 GB storage, zero egress fees)
# Create with:  npx wrangler r2 bucket create rac-media
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rac-media"

# ---------------------------------------------------------------------------
# Secrets (never commit these — set with `npx wrangler secret put <NAME>`)
#   ADMIN_EMAIL           e.g. admin@ropeaccesscenter.com
#   ADMIN_PASSWORD_HASH   output of `npm run admin:hash -- "your-password"`
#   SESSION_SECRET        random 64-char hex, `openssl rand -hex 32`
#   TURNSTILE_SECRET_KEY  optional, Cloudflare Turnstile
# ---------------------------------------------------------------------------
